<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KS Transport</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16325c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#677085;--ln:#e3e6ec;--ac:#1f6feb;--ok:#1a7f4b;--wa:#b7791f;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1218;--card:#181d26;--tx:#eef1f6;--mut:#95a0b5;--ln:#272e3b;--ac:#5b9dff;--ok:#4cc38a;--wa:#e0a84a;--bad:#ff6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1218;--card:#181d26;--tx:#eef1f6;--mut:#95a0b5;--ln:#272e3b;--ac:#5b9dff;--ok:#4cc38a;--wa:#e0a84a;--bad:#ff6b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
#v{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:16px 0 8px;color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 10px;font-size:13px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card.n{cursor:default}
.l{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:13px}
.amt{font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--wa)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);white-space:nowrap}
.pill.Paid{color:var(--ok);border-color:var(--ok)}.pill.Unpaid{color:var(--wa);border-color:var(--wa)}.pill.Part{color:var(--ac);border-color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.brand{max-width:720px;margin:0 auto;padding:12px 16px 0;font-weight:700;color:var(--ac)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg .w{grid-column:1/-1}
.note{background:var(--card);border:1px dashed var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0;color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font:inherit;font-size:10px;cursor:pointer}
nav button span{display:block;font-size:18px}
nav button.on{color:var(--ac);font-weight:700}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#m[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
#t{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;font-size:14px}
#t[hidden]{display:none}
#inv{position:fixed;inset:0;background:#fff;color:#111;overflow:auto;z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#inv[hidden]{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media print{body>*:not(#inv){display:none!important}#inv{position:static!important;padding:0!important}.np{display:none!important}}

html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body[data-pg=home]{--pa:#0ea5a4}body[data-pg=trips]{--pa:#3b82f6}body[data-pg=companies]{--pa:#8b5cf6}body[data-pg=fuel]{--pa:#f59e0b}body[data-pg=vehicles]{--pa:#22a06b}body[data-pg=more],body[data-pg=fare]{--pa:#ec4899}body[data-pg=report]{--pa:#6366f1}body[data-pg=service]{--pa:#ef4444}
h1{color:var(--pa,var(--tx))}
h3{color:var(--pa,var(--mut));font-weight:700;letter-spacing:.3px}
.btn{background:var(--pa,var(--ac))}
.card{border-left:4px solid var(--pa,var(--ln))}
nav button.on{color:var(--pa,var(--ac))}
.hdr{background:linear-gradient(135deg,#16325c 0%,#1f6feb 58%,#f59e0b 130%);color:#fff}
.hin{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hin b{font-size:19px;letter-spacing:.3px}.hin .sub{font-size:12px;opacity:.9}
.lg{width:46px;height:46px;border-radius:12px;background:#fff;padding:4px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.grid .stat{border-top:3px solid var(--pa,var(--ln))}
.grid .stat:nth-child(1){border-top-color:#22a06b;background-image:linear-gradient(180deg,rgba(34,160,107,.14),transparent 70%)}
.grid .stat:nth-child(2){border-top-color:#f59e0b;background-image:linear-gradient(180deg,rgba(245,158,11,.14),transparent 70%)}
.grid .stat:nth-child(3){border-top-color:#3b82f6;background-image:linear-gradient(180deg,rgba(59,130,246,.14),transparent 70%)}
.grid .stat:nth-child(4){border-top-color:#8b5cf6;background-image:linear-gradient(180deg,rgba(139,92,246,.14),transparent 70%)}
</style>
</head>

function pc(s){const m=String(s).match(/(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null}
function hav(a,b){const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}

function words(n){
  n=Math.round(Math.abs(+n||0));
  if(!n)return 'Zero';
  const o=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],t=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const b=v=>v<20?o[v]:t[Math.floor(v/10)]+(v%10?' '+o[v%10]:'');
  const h=v=>(v>99?o[Math.floor(v/100)]+' Hundred'+(v%100?' ':''):'')+(v%100?b(v%100):'');
  let s='';
  [[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']].forEach(([v,l])=>{if(n>=v){s+=h(Math.floor(n/v))+' '+l+' ';n%=v}});
  return (s+h(n)).trim();
}

async function pdfOut(share){
  if(!window.jspdf)return note('PDF tool couldn’t load. Check your internet and reload the page.');
  if(!cur)return;
  await commitInv();
  let blob;try{blob=makePdfs(cur.items).output('blob')}catch(e){return note('Couldn’t create the PDF')}
  const f0=cur.items[0],f1=cur.items[cur.items.length-1],cl=s=>String(s).replace(/[^A-Za-z0-9]+/g,'_');
  const fn=(cur.items.length===1?f0.no+'-'+cl(f0.c.name):cl(biz())+'-'+f0.no+'-to-'+f1.no).slice(0,80)+'.pdf';
  if(share&&navigator.canShare){try{const f=new File([blob],fn,{type:'application/pdf'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name==='AbortError')return}}
  try{const dl=await claude.use('downloads');if(!dl)return note('Saving isn’t available here');await dl.save({filename:fn,data:blob});note('PDF saved. Open it from your files to share.')}
  catch(e){if(!e||e.code!=='declined')note('Couldn’t save the PDF: '+((e&&(e.code||e.message))||'not available'))}
}

async function doBackup(){

  try{const dl=await claude.use('downloads');if(!dl)return note('Saving isn’t available here');

    try{localStorage.setItem('tmlast',new Date().toISOString())}catch(e){}
    note('Backup saved. Delete older copies in your Files app.');render()}
  catch(e){if(!e||e.code!=='declined')note('Couldn’t save the backup: '+((e&&(e.code||e.message))||'not available'))}

async function doRestore(f){
  try{
    const j=JSON.parse(await f.text()),d=j&&j.data;
    if(!d||!Array.isArray(d.tripLog))return note('This isn’t a KS Transport backup file');
    let n=0;
    for(const c of COLL)for(const o of (d[c]||[])){if(o&&o.id){await save(c,{...o});n++}}
    if(d.cfg&&d.cfg.name)await save('settings',{...d.cfg});
    note('Restored '+n+' records')
  }catch(e){note('Couldn’t restore: '+((e&&(e.message||e.code))||'bad file'))}
}

function calcAlloc(){
  const m=Object.create(null),g=Object.create(null),pay=Object.create(null);
  S.tripLog.forEach(t=>{const k=pkey(t);if(k&&t.paid!=='Paid')(g[k]=g[k]||[]).push(t)});
  S.payments.forEach(p=>{const k=pkey(p);if(k)pay[k]=(pay[k]||0)+(+p.amount||0)});
  Object.keys(g).forEach(k=>{let r=pay[k]||0;g[k].sort((u,w)=>String(u.date).localeCompare(w.date)).forEach(t=>{const a=Math.min(lt(t),Math.max(r,0));m[t.id]=a;r-=a})});

function pgHome(){
  const m=today().slice(0,7),ms=x=>String(x.date||'').startsWith(m);
  const inc=sum(S.tripLog.filter(ms)),cost=sum(S.fuelLog.filter(ms))+sum(S.service.filter(ms)),pr=inc-cost;
  const w0=wk(today()),wt=S.tripLog.filter(t=>String(t.date||'')>=w0);
  const keys=new Set();S.companies.forEach(c=>keys.add(c.id));S.tripLog.forEach(t=>{const k=pkey(t);if(k)keys.add(k)});
  const nm=k=>k.startsWith('o:')?otherName(k.slice(2)):label('companies',k);
  const ow=[...keys].filter(k=>k.startsWith('o:')||byId('companies',k)).map(k=>({k,v:owed(k)})).filter(o=>o.v>0.5).sort((u,w)=>w.v-u.v);
  const al=[];
  S.vehicles.forEach(v=>{
    DOCS.forEach(([k,t])=>{const l=v[k+'Till'];if(l){const d=days(l);if(d<=30)al.push(`${esc(v.no)}: ${t} ${d<0?'expired':'expires in '+d+' days'}`)}});
    const r=S.service.filter(s=>s.vehicle===v.id&&(s.nextTill||+s.nextKm>0)).sort((u,w)=>String(w.date).localeCompare(u.date))[0];
    if(r){
      if(r.nextTill){const d=days(r.nextTill);if(d<=30)al.push(`${esc(v.no)}: ${esc(r.type||'Service')} ${d<0?'overdue':'due in '+d+' days'}`)}
      if(+r.nextKm>0){const lk=Math.max(0,...S.fuelLog.filter(f=>f.vehicle===v.id).map(f=>+f.cur||0)),left=r.nextKm-lk;if(lk&&left<=500)al.push(`${esc(v.no)}: ${esc(r.type||'Service')} ${left<0?'overdue by '+(-left)+' km':'due in '+left+' km'}`)}
    }
  });
  let lb=null;try{lb=localStorage.getItem('tmlast')}catch(e){}
  const bd=lb?Math.floor((Date.now()-new Date(lb).getTime())/864e5):null;
  const bk=(bd===null||bd>=7)?`<div class='card n'><div class='warn'><b>${bd===null?'No backup yet':'Last backup was '+bd+' days ago'}</b></div><div class='mut'>Save a copy of your data on your phone.</div><button class='btn s' id='bkn'>Backup now</button></div>`:'';
  return `<div class='top'><h1>Home</h1></div>${bk}
  <div class='grid'><div class='stat'><span class='mut'>Income this month</span><b>${rs(inc)}</b></div><div class='stat'><span class='mut'>Costs this month</span><b>${rs(cost)}</b></div><div class='stat'><span class='mut'>Profit this month</span><b class='${pr<0?'neg':'pos'}'>${rs(pr)}</b></div><div class='stat'><span class='mut'>Money to receive</span><b class='${ow.length?'warn':''}'>${rs(ow.reduce((s,o)=>s+o.v,0))}</b></div></div>
  <div class='mut'>This week: ${wt.length} trips · ${rs(sum(wt))}</div>
  <h3>Who owes you</h3>${ow.length?ow.slice(0,5).map(o=>`<div class='card n'><div class='l'><b>${esc(nm(o.k))}</b><b class='warn'>${rs(o.v)}</b></div></div>`).join(''):`<div class='card n mut'>Nobody owes you anything right now.</div>`}
  <h3>Needs attention</h3>${al.length?al.map(a=>`<div class='card n warn'>${a}</div>`).join(''):`<div class='card n mut'>Nothing urgent. Documents and services look fine.</div>`}`;
}

  <div class='card' data-go='fare'><b>🧮 Fare calculator</b><div class='mut'>Work out a trip fare from two locations.</div></div>
  <div class='card' data-go='report'><b>📊 Monthly report</b><div class='mut'>Income, costs and profit. Share as a PDF.</div></div>
  <div class='card' data-go='service'><b>🔧 Service &amp; tyres</b><div class='mut'>Repairs, tyre changes and service reminders.</div></div>`;
}
function pgSvc(){
  const m=S.service.filter(inM).sort((u,w)=>String(w.date).localeCompare(u.date));
  return `<div class='top'><h1>Service &amp; tyres</h1><button class='btn' id='add'>+ Add</button></div>${monBar()}
  <div class='grid'><div class='stat'><span class='mut'>Spent in ${mlabel(mon)}</span><b>${rs(sum(m))}</b></div><div class='stat'><span class='mut'>Entries</span><b>${m.length}</b></div></div>
  ${m.length?m.map(x=>`<div class='card' data-e='service|${esc(x.id)}'><div class='l'><b>${esc(x.type)} · ${esc(label('vehicles',x.vehicle))}</b><span class='amt'>${rs(x.amount)}</span></div><div class='mut'>${fd(x.date)}${+x.km>0?' · '+x.km+' km':''}${x.nextTill?' · next '+fd(x.nextTill):''}${+x.nextKm>0?' · next at '+x.nextKm+' km':''}${x.note?' · '+esc(x.note):''}</div></div>`).join(''):`<div class='empty'>No service entries in this month.</div>`}
  <div class='note'>Add a service or tyre change with its next due date or km. A reminder shows on Home 30 days (or 500 km) before it is due.</div>`;
}
function repData(){
  const inc=S.tripLog.filter(inM),fu=S.fuelLog.filter(inM),sv=S.service.filter(inM),py=S.payments.filter(inM);
  const vs=S.vehicles.map(v=>{const i=sum(inc.filter(t=>t.vehicle===v.id)),f=sum(fu.filter(t=>t.vehicle===v.id)),s=sum(sv.filter(t=>t.vehicle===v.id));return{n:v.no,i,f,s,p:i-f-s}}).sort((u,w)=>String(u.n).localeCompare(String(w.n)));
  const rest={n:'Not assigned',i:sum(inc)-sum(vs,'i'),f:sum(fu)-sum(vs,'f'),s:sum(sv)-sum(vs,'s')};rest.p=rest.i-rest.f-rest.s;
  if(Math.abs(rest.i)+Math.abs(rest.f)+Math.abs(rest.s)>0.5)vs.push(rest);
  const pt=Object.create(null),pr=Object.create(null);
  inc.forEach(t=>{const k=pkey(t);if(k)pt[k]=(pt[k]||0)+lt(t)});
  py.forEach(p=>{const k=pkey(p);if(k)pr[k]=(pr[k]||0)+(+p.amount||0)});
  const okk=k=>k.startsWith('o:')||byId('companies',k);
  const cu=[...new Set([...Object.keys(pt),...Object.keys(pr)])].filter(okk).map(k=>({n:k.startsWith('o:')?otherName(k.slice(2)):label('companies',k),i:pt[k]||0,r:pr[k]||0,o:owed(k)})).sort((u,w)=>w.i-u.i);
  const keys=new Set();S.companies.forEach(c=>keys.add(c.id));S.tripLog.forEach(t=>{const k=pkey(t);if(k)keys.add(k)});
  const ow=[...keys].filter(okk).reduce((s,k)=>s+Math.max(0,owed(k)),0);
  return{inc:sum(inc),fu:sum(fu),sv:sum(sv),py:sum(py),vs,cu,ow};
}
function pgRep(){
  const r=repData(),pf=r.inc-r.fu-r.sv;
  return `<div class='top'><h1>Monthly report</h1></div>${monBar()}
  <div class='grid'><div class='stat'><span class='mut'>Income</span><b>${rs(r.inc)}</b></div><div class='stat'><span class='mut'>Fuel + service</span><b>${rs(r.fu+r.sv)}</b></div><div class='stat'><span class='mut'>Profit</span><b class='${pf<0?'neg':'pos'}'>${rs(pf)}</b></div><div class='stat'><span class='mut'>Payments received</span><b>${rs(r.py)}</b></div></div>
  <div class='row'><button class='btn' id='rep'>Share PDF</button><button class='btn g' id='reps'>Save PDF</button></div>
  <h3>By vehicle</h3>${r.vs.length?r.vs.map(v=>`<div class='card n'><div class='l'><b>${esc(v.n)}</b><b class='${v.p<0?'neg':'pos'}'>${rs(v.p)}</b></div><div class='mut'>Income ${rs(v.i)} · fuel ${rs(v.f)} · service ${rs(v.s)}</div></div>`).join(''):`<div class='empty'>No data yet.</div>`}
  <h3>By customer</h3>${r.cu.length?r.cu.map(c=>`<div class='card n'><div class='l'><b>${esc(c.n)}</b><span class='amt'>${rs(c.i)}</span></div><div class='mut'>Received ${rs(c.r)} · outstanding now ${rs(Math.max(0,c.o))}</div></div>`).join(''):`<div class='empty'>No trips in this month.</div>`}`;
}
function rup(d,x,yb,h){
  const w=h*0.62,t=yb-h,cx=x+w*0.5,cy=t+h*0.3,rx=w*0.46,ry=h*0.3;
  d.setDrawColor(0,0,0);d.setLineWidth(Math.max(0.18,h*0.085));
  d.line(x,t,x+w,t);d.line(x,t+h*0.22,x+w,t+h*0.22);
  let pp=[cx,t];
  for(let a=-60;a<=90;a+=30){const r=a*Math.PI/180,q=[cx+rx*Math.cos(r),cy+ry*Math.sin(r)];d.line(pp[0],pp[1],q[0],q[1]);pp=q}
  d.line(pp[0],pp[1],x+w*0.06,t+h*0.6);
  d.line(x+w*0.14,t+h*0.6,x+w*0.96,yb);
  d.setLineWidth(0.25);
}
function rm(d,s,xr,yb,sz){const w=d.getTextWidth(s),h=sz*0.3528*0.72;d.text(s,xr,yb,{align:'right'});rup(d,xr-w-h*0.62-1.6,yb,h)}
function makeRep(){
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),r=repData(),W=210,M=15;
  const N=n=>(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const fs=(sz,st)=>{d.setFont('helvetica',st||'normal');d.setFontSize(sz)};
  d.setFillColor(22,50,92);d.rect(0,0,W,30,'F');
  d.setFillColor(255,255,255);d.roundedRect(M,5,20,20,2,2,'F');try{d.addImage(LOGO,'PNG',M+1.5,6.5,17,17)}catch(e){}
  d.setTextColor(255,255,255);fs(20,'bold');d.text(biz(),M+25,14);fs(11);d.text('Monthly report - '+mlabel(mon),M+25,23);
  d.setTextColor(0,0,0);d.setLineWidth(0.25);
  let y=42;
  const chk=h=>{if(y+h>280){d.addPage();y=20}};
  const sec=t=>{chk(16);fs(12,'bold');d.setTextColor(0,0,0);d.text(t,M,y);y+=3;d.setDrawColor(150,158,170);d.line(M,y,W-M,y);y+=7};
  sec('Summary');
  [['Income from trips',r.inc,0],['Fuel',r.fu,0],['Service and repairs',r.sv,0],['Profit',r.inc-r.fu-r.sv,1],['Payments received this month',r.py,0],['Total outstanding today',r.ow,0]].forEach(([k,v,b])=>{chk(8);fs(10.5,b?'bold':'normal');d.text(k,M,y);rm(d,N(v),W-M,y,10.5);y+=7});
  const X=[0,100,130,160,W-M];
  const row=(c,b)=>{chk(7);fs(9.5,b?'bold':'normal');d.text(String(c[0]).slice(0,26),M,y);[1,2,3,4].forEach(i=>{if(c[i]!==undefined)d.text(typeof c[i]==='number'?N(c[i]):String(c[i]),X[i],y,{align:'right'})});d.setDrawColor(227,230,236);d.line(M,y+2,W-M,y+2);y+=6.5};
  y+=4;sec('By vehicle');
  row(['Vehicle','Income','Fuel','Service','Profit'],1);r.vs.forEach(v=>row([v.n,v.i,v.f,v.s,v.p]));
  y+=4;sec('By customer');
  row(['Customer','Income','Received','Outstanding'],1);r.cu.forEach(c=>row([c.n,c.i,c.r,Math.max(0,c.o)]));
  chk(10);fs(8.5);d.setTextColor(110,120,135);d.text('Generated '+fd(today())+' by '+biz(),M,Math.min(y+6,290));
  d.setTextColor(0,0,0);
  return d;
}
async function shareBlob(blob,fn,share){
  if(share&&navigator.canShare){try{const f=new File([blob],fn,{type:'application/pdf'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return}}catch(e){if(e&&e.name==='AbortError')return}}
  try{const dl=await claude.use('downloads');if(!dl)return note('Saving isn’t available here');await dl.save({filename:fn,data:blob});note('PDF saved. Open it from your files to share.')}
  catch(e){if(!e||e.code!=='declined')note('Couldn’t save the PDF: '+((e&&(e.code||e.message))||'not available'))}
}
async function repOut(share){
  if(!window.jspdf)return note('PDF tool couldn’t load. Check your internet and reload the page.');
  let blob;try{blob=makeRep().output('blob')}catch(e){return note('Couldn’t create the PDF')}
  await shareBlob(blob,biz().replace(/[^A-Za-z0-9]+/g,'_')+'-report-'+mon+'.pdf',share);
}
/* ---------- Render ---------- */
function render(){
  ALLOC=calcAlloc();document.body.dataset.pg=tab;
  $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" class="${(k===tab||(k==='more'&&['fare','report','service'].includes(tab)))?'on':''}"><span>${i}</span>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;co=null;$('#v').dataset.p='';render();scrollTo(0,0)});
  const v=$('#v');
  if(tab==='fare'){if(v.dataset.p==='fare')return;v.innerHTML=pgFare();v.dataset.p='fare';wireFare();return}
  v.dataset.p=tab;
  const bn='';
  v.innerHTML=bn+{home:pgHome,more:pgMore,report:pgRep,service:pgSvc,trips:pgTrips,companies:pgCo,fuel:pgFuel,vehicles:pgVeh}[tab]();
  const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  v.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{const [c,i]=e.dataset.e.split('|');openM(c,i)});
  v.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{co=e.dataset.c;render()});
  v.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{tab=e.dataset.go;v.dataset.p='';render();scrollTo(0,0)});
  v.querySelectorAll('[data-rp]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const k=b.dataset.rp;openM('payments',null,k.startsWith('o:')?{other:otherName(k.slice(2))}:{company:k})});
  v.querySelectorAll('[data-pay]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();save('tripLog',{...byId('tripLog',b.dataset.pay),paid:'Paid'})});
  const mo=$('#mon');if(mo)mo.onchange=()=>{if(mo.value){mon=mo.value;render()}};
  on('add',()=>openM(T[tab],null,tab==='trips'&&tview==='day'?{date:tday}:undefined));on('cfg',()=>openM('settings','invoice'));
  on('bk',()=>{co=null;render()});on('ad',()=>openM('tripLog',null,{company:co}));
  on('ec',()=>openM('companies',co));on('iv',()=>openInv(co));on('mp',markPaid);on('ia',openAll);on('bk1',doBackup);on('hist',openHist);on('rp',()=>openM('payments',null,{company:co}));on('bkn',doBackup);
  const td=$('#tday');if(td)td.onchange=()=>{if(td.value){tday=td.value;render()}};
  on('dprev',()=>{tday=addD(tday,-1);render()});on('dnext',()=>{tday=addD(tday,1);render()});
  on('vday',()=>{tview='day';render()});on('vmon',()=>{tview='month';render()});on('vtd',()=>{tday=today();render()});on('rep',()=>repOut(true));on('reps',()=>repOut(false));
  on('dc',()=>{const b=$('#dc');if(b.dataset.s){const id=co;co=null;del('companies',id);render()}else{b.dataset.s=1;const n=S.tripLog.filter(t=>t.company===co).length;b.textContent='Tap again to delete'+(n?' ('+n+' trips stay in Trips)':'')}});on('rs1',()=>$('#rsf').click());
  const rf=$('#rsf');if(rf)rf.onchange=()=>{if(rf.files[0])doRestore(rf.files[0])};
  
  v.querySelectorAll('[data-inv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openInv(b.dataset.inv)});
}

render();
(async()=>{
  try{db=window.claude?await claude.use('db'):null}catch(e){db=null}
  if(db){
    setTimeout(()=>{if(!got)note('Shared data is taking a while to load…')},10000);
    COLL.forEach(c=>db.collection(c).onSnapshot(s=>{got=true;S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>note('Couldn’t load '+c+': '+(e.code||e.message))));
    db.doc('settings/invoice').onSnapshot(s=>{S.cfg=s.exists?s.data():{};render()},()=>{});
  }else LS.load();
  ready=true;render();
})();

try{if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
