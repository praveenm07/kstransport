<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KS Transport</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16325c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#677085;--ln:#e3e6ec;--ac:#1f6feb;--ok:#1a7f4b;--wa:#b7791f;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1218;--card:#181d26;--tx:#eef1f6;--mut:#95a0b5;--ln:#272e3b;--ac:#5b9dff;--ok:#4cc38a;--wa:#e0a84a;--bad:#ff6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1218;--card:#181d26;--tx:#eef1f6;--mut:#95a0b5;--ln:#272e3b;--ac:#5b9dff;--ok:#4cc38a;--wa:#e0a84a;--bad:#ff6b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
#v{max-width:720px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:16px 0 8px;color:var(--mut)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.s{padding:6px 10px;font-size:13px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card.n{cursor:default}
.l{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:13px}
.amt{font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.warn{color:var(--wa)}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);white-space:nowrap}
.pill.Paid{color:var(--ok);border-color:var(--ok)}.pill.Unpaid{color:var(--wa);border-color:var(--wa)}.pill.Part{color:var(--ac);border-color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:28px 8px}
.brand{max-width:720px;margin:0 auto;padding:12px 16px 0;font-weight:700;color:var(--ac)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg .w{grid-column:1/-1}
.note{background:var(--card);border:1px dashed var(--ln);border-radius:12px;padding:10px 12px;margin:12px 0;color:var(--mut);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0;font:inherit;font-size:10px;cursor:pointer}
nav button span{display:block;font-size:18px}
nav button.on{color:var(--ac);font-weight:700}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#m[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
#t{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;font-size:14px}
#t[hidden]{display:none}
#inv{position:fixed;inset:0;background:#fff;color:#111;overflow:auto;z-index:40;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#inv[hidden]{display:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
@media print{body>*:not(#inv){display:none!important}#inv{position:static!important;padding:0!important}.np{display:none!important}}

html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body[data-pg=home]{--pa:#0ea5a4}body[data-pg=trips]{--pa:#3b82f6}body[data-pg=companies]{--pa:#8b5cf6}body[data-pg=fuel]{--pa:#f59e0b}body[data-pg=vehicles]{--pa:#22a06b}body[data-pg=more],body[data-pg=fare]{--pa:#ec4899}body[data-pg=report]{--pa:#6366f1}body[data-pg=service]{--pa:#ef4444}
h1{color:var(--pa,var(--tx))}
h3{color:var(--pa,var(--mut));font-weight:700;letter-spacing:.3px}
.btn{background:var(--pa,var(--ac))}
.card{border-left:4px solid var(--pa,var(--ln))}
nav button.on{color:var(--pa,var(--ac))}
.hdr{background:linear-gradient(135deg,#16325c 0%,#1f6feb 58%,#f59e0b 130%);color:#fff}
.hin{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hin b{font-size:19px;letter-spacing:.3px}.hin .sub{font-size:12px;opacity:.9}
.lg{width:46px;height:46px;border-radius:12px;background:#fff;padding:4px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.grid .stat{border-top:3px solid var(--pa,var(--ln))}
.grid .stat:nth-child(1){border-top-color:#22a06b;background-image:linear-gradient(180deg,rgba(34,160,107,.14),transparent 70%)}
.grid .stat:nth-child(2){border-top-color:#f59e0b;background-image:linear-gradient(180deg,rgba(245,158,11,.14),transparent 70%)}
.grid .stat:nth-child(3){border-top-color:#3b82f6;background-image:linear-gradient(180deg,rgba(59,130,246,.14),transparent 70%)}
.grid .stat:nth-child(4){border-top-color:#8b5cf6;background-image:linear-gradient(180deg,rgba(139,92,246,.14),transparent 70%)}

.prow{border-top:1px solid var(--ln);padding:8px 0}
.cb{height:10px;border-radius:6px;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.qa button{border:0;border-radius:14px;padding:12px 4px;color:#fff;font:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.22);background-image:linear-gradient(135deg,rgba(255,255,255,.25),rgba(0,0,0,.1))}
.qa button span{font-size:22px}
.banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.banner img{display:block;width:100%;height:170px;object-fit:cover;object-position:center 40%}
.banner .bt{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 10px;color:#fff;background:linear-gradient(180deg,transparent,rgba(10,20,40,.8))}
.banner .bt b{font-size:19px}
.btn{background-image:linear-gradient(135deg,rgba(255,255,255,.22),rgba(0,0,0,.08))}
.btn.g,.btn.d{background-image:none}
body[data-pg=pay]{--pa:#10b981}body[data-pg=money]{--pa:#14b8a6}
</style>
</head>

/* ---------- Fare calculator ---------- */
function pc(s){const m=String(s).match(/(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)/);if(!m)return null;const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null}
function hav(a,b){const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function pgFare(){return `<div class="top"><h1>Fare calculator</h1></div>
<div class="card n">
<label>From (latitude, longitude)<input id="fa" placeholder="12.9716, 77.5946" autocomplete="off"></label>
<label>To (latitude, longitude)<input id="fb" placeholder="13.0827, 80.2707" autocomplete="off"></label>
<label>Rate per km (₹)<input id="fr" inputmode="decimal" placeholder="e.g. 25"></label>
<label>Actual km (optional: type it if you know the real road distance)<input id="fk" inputmode="decimal"></label>
<label>Road factor (road km ÷ straight-line km)<input id="ff" inputmode="decimal"></label>
<label class="ck"><input type="checkbox" id="fx">Return trip (double the distance)</label>
<div class="row"><button class="btn g" id="fc">Clear</button></div></div>
<div id="fo"></div>
<div class="note">Free and works offline. Distance is the straight line between the two points multiplied by the road factor, so it is an estimate. For an exact fare, tap “Open in Google Maps”, read the road km there (free, no sign-up) and type it into Actual km. Tip: in Google Maps, press and hold a spot, then tap the coordinates to copy them.</div>`}
function calc(){
  const a=pc(FS.fa),b=pc(FS.fb),r=+FS.fr||0,f=+FS.ff||1.25,ak=+FS.fk||0,m=FS.fx?2:1;
  let used=0,st='',lab='Estimated road distance';
  if(ak){used=ak*m;lab='Distance (your entry)'}
  if(a&&b){const s=hav(a,b);if(!ak)used=s*f*m;st=`<div class="mut">Straight-line distance: ${s.toFixed(1)} km${m>1?' (one way)':''}</div>`}
  const fare=used*r;let h='';
  if(!used&&(FS.fa||FS.fb))h='<div class="note">Enter both points like 12.9716, 77.5946, or type the actual km.</div>';
  else if(used){
    h=`<div class="grid"><div class="stat"><span class="mut">${lab}</span><b>${used.toFixed(1)} km</b></div><div class="stat"><span class="mut">Fare${r?'':' (enter a rate)'}</span><b class="pos">${rs(fare)}</b></div></div>${st}
    <div class="row">${fare>0?'<button class="btn" id="fs">Save as trip</button>':''}${a&&b?`<a class="btn g" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${a[0]},${a[1]}&destination=${b[0]},${b[1]}&travelmode=driving">Open in Google Maps</a>`:''}</div>`}
  $('#fo').innerHTML=h;
  const s=$('#fs');if(s)s.onclick=()=>openM('tripLog',null,{amount:Math.round(fare*100)/100,km:+used.toFixed(1)});
}
function wireFare(){
  ['fa','fb','fr','fk','ff'].forEach(k=>{const e=$('#'+k);e.value=FS[k];e.oninput=()=>{FS[k]=e.value;try{localStorage.setItem('tmfare',JSON.stringify(FS))}catch(x){}calc()}});
  const x=$('#fx');x.checked=FS.fx;x.onchange=()=>{FS.fx=x.checked;try{localStorage.setItem('tmfare',JSON.stringify(FS))}catch(e){}calc()};
  $('#fc').onclick=()=>{FS={fa:'',fb:'',fr:'',fk:'',ff:'1.25',fx:false};try{localStorage.setItem('tmfare',JSON.stringify(FS))}catch(e){}['fa','fb','fr','fk','ff'].forEach(k=>{$('#'+k).value=FS[k]});x.checked=false;calc()};

}

function rup(d,x,yb,h){

  d.setDrawColor(0,0,0);d.setLineWidth(Math.max(0.18,h*0.085));
  d.line(x,t,x+w,t);d.line(x,t+h*0.22,x+w,t+h*0.22);
  let pp=[cx,t];
  for(let a=-60;a<=90;a+=30){const r=a*Math.PI/180,q=[cx+rx*Math.cos(r),cy+ry*Math.sin(r)];d.line(pp[0],pp[1],q[0],q[1]);pp=q}
  d.line(pp[0],pp[1],x+w*0.06,t+h*0.6);
  d.line(x+w*0.14,t+h*0.6,x+w*0.96,yb);
  d.setLineWidth(0.25);
}

async function packData(){
  const json=JSON.stringify({app:'KS Transport',v:1,saved:new Date().toISOString(),data:S});
  if(typeof CompressionStream==='function'){
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    let b='';for(let i=0;i<buf.length;i+=0x8000)b+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return 'KSB1:'+btoa(b);
  }
  return 'KSB0:'+btoa(unescape(encodeURIComponent(json)));
}
async function unpackData(t){
  t=String(t).trim();
  if(t.startsWith('{'))return JSON.parse(t);
  const m=t.match(/^(KSB[01]):([A-Za-z0-9+\/=\s]+)$/);
  if(!m)throw new Error('not a backup code');
  const bin=atob(m[2].replace(/\s+/g,''));
  if(m[1]==='KSB0')return JSON.parse(decodeURIComponent(escape(bin)));
  const u8=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}

  try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.focus();a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}

function render(){
  ALLOC=calcAlloc();MM=milMap();document.body.dataset.pg=tab;
  $('#nav').innerHTML=TABS.map(([k,l,i])=>`<button data-t="${k}" class="${(k===tab||(k==='more'&&['fare','report','service','vehicles','money'].includes(tab)))?'on':''}"><span>${i}</span>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;co=null;$('#v').dataset.p='';render();scrollTo(0,0)});
  const v=$('#v');
  if(tab==='fare'){if(v.dataset.p==='fare')return;v.innerHTML=pgFare();v.dataset.p='fare';wireFare();return}
  v.dataset.p=tab;
  const bn='';
  v.innerHTML=bn+{home:pgHome,more:pgMore,report:pgRep,service:pgSvc,trips:pgTrips,pay:pgPay,money:pgMoney,companies:pgCo,fuel:pgFuel,vehicles:pgVeh}[tab]();
  const on=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn};
  v.querySelectorAll('[data-e]').forEach(e=>e.onclick=()=>{const [c,i]=e.dataset.e.split('|');openM(c,i)});
  v.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{co=e.dataset.c;render()});
  v.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{tab=e.dataset.go;v.dataset.p='';render();scrollTo(0,0)});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='trip')openM('tripLog',null,{date:today()});else if(a==='fuel')openM('fuelLog');else if(a==='exp')openM('expLog');else if(a==='bk')openBk()});
  v.querySelectorAll('[data-rp]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openRecv(b.dataset.rp)});
  v.querySelectorAll('[data-tt]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.tt,t=byId('tripLog',id);if(!t)return;if(balOf(t)>0.004)markPaidTrip(id);else two(b,'Tap again',()=>unpayTrip(id))});
  v.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>markPaidTrip(b.dataset.mp));
  v.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>openPart(b.dataset.pp));
  v.querySelectorAll('[data-recv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openRecv(b.dataset.recv)});
  v.querySelectorAll('[data-markall]').forEach(b=>b.onclick=()=>two(b,'Tap again to confirm',async()=>{const k=b.dataset.markall;for(const t of tripsOf(k).filter(t=>balOf(t)>0.004)){await payTrip(t.id,balOf(byId('tripLog',t.id)),today(),'')}note('All marked paid')}));
  v.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>two(b,'Tap again to undo',()=>undoReceipt(b.dataset.undo)));
  v.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>applyAdv(b.dataset.adv));
  const mo=$('#mon');if(mo)mo.onchange=()=>{if(mo.value){mon=mo.value;render()}};
  on('add',()=>openM(T[tab],null,(tab==='trips'||tab==='money')&&tview==='day'?{date:tday}:undefined));on('cfg',()=>openM('settings','invoice'));
  on('bk',()=>{co=null;render()});on('ad',()=>openM('tripLog',null,{company:co}));
  on('ec',()=>openM('companies',co));on('iv',()=>openInv(co));on('ia',openAll);on('bk1',openBk);on('hist',openHist);on('rp',()=>openRecv(co));on('bkn',openBk);on('upd',updateApp);
  on('pvp',()=>{pview='pending';render()});on('pvr',()=>{pview='received';render()});
  const td=$('#tday');if(td)td.onchange=()=>{if(td.value){tday=td.value;render()}};
  on('dprev',()=>{tday=addD(tday,-1);render()});on('dnext',()=>{tday=addD(tday,1);render()});
  on('vday',()=>{tview='day';render()});on('vmon',()=>{tview='month';render()});on('vtd',()=>{tday=today();render()});on('rep',()=>repOut(true));on('reps',()=>repOut(false));
  on('dc',()=>{const b=$('#dc');if(b.dataset.s){const id=co;co=null;del('companies',id);render()}else{b.dataset.s=1;const n=S.tripLog.filter(t=>t.company===co).length;b.textContent='Tap again to delete'+(n?' ('+n+' trips stay in Trips)':'')}});on('rs1',()=>$('#rsf').click());
  const rf=$('#rsf');if(rf)rf.onchange=()=>{if(rf.files[0])doRestore(rf.files[0])};
  v.querySelectorAll('[data-inv]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();openInv(b.dataset.inv)});
}

render();
(async()=>{
  try{db=window.claude?await claude.use('db'):null}catch(e){db=null}
  if(db){
    setTimeout(()=>{if(!got)note('Shared data is taking a while to load…')},10000);
    COLL.forEach(c=>db.collection(c).onSnapshot(s=>{got=true;S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>note('Couldn’t load '+c+': '+(e.code||e.message))));
    db.doc('settings/invoice').onSnapshot(s=>{S.cfg=s.exists?s.data():{};render()},()=>{});
  }else LS.load();
  ready=true;render();migratePay().catch(()=>{});
})();

/* ---------- automatic updates ---------- */
(function(){
  let going=false;
  const busy=()=>{const m=document.getElementById('m'),v=document.getElementById('inv');return !!((m&&!m.hidden)||(v&&!v.hidden))};
  const reload=()=>{if(going)return;going=true;const go=()=>{if(busy()){setTimeout(go,4000);return}note('Updating to the latest version…');setTimeout(()=>location.reload(),700)};go()};
  const onl=()=>navigator.onLine!==false;
  async function checkVer(){
    if(!onl())return;
    try{
      const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});
      if(!r.ok)return;
      const j=await r.json(),v=j&&j.v;
      if(v&&v!==APP_VER){
        let tried='';try{tried=sessionStorage.getItem('kst_tried')||''}catch(e){}
        if(tried!==v){try{sessionStorage.setItem('kst_tried',v)}catch(e){}reload()}
      }
    }catch(e){}
  }
  try{
    if('serviceWorker' in navigator){
      const had=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)reload()});
      navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
        const upd=()=>{if(onl())reg.update().catch(()=>{})};
        upd();setInterval(upd,15*60*1000);
        document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')upd()});
      }).catch(()=>{});
    }
  }catch(e){}
  checkVer();setInterval(checkVer,10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVer()});
  window.addEventListener('online',checkVer);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
